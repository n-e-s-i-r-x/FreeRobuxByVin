<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator</title>
<link id="favicon" rel="icon" href="icon.png">
<style>
  :root{
    --bg1:#0b0b10; --bg2:#15151d; --panel:#1b1b26; --panel2:#22222f;
    --main:#e2231a; --main-dark:#a81810; --white:#f4f4f7; --grey:#8d8d9b;
    --accent:#ffd21a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    font-family:'Segoe UI', 'Trebuchet MS', Arial, sans-serif;
    background: #0b0b10;
    background-image:
      linear-gradient(rgba(5,5,8,.55), rgba(5,5,8,.7)),
      var(--bg-image, none);
    background-size: cover;
    background-position: center;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; position:relative;
  }

  .cube{
    position:absolute; width:46px; height:46px;
    background:linear-gradient(135deg,#3a3a4a,#1c1c26);
    border:2px solid #45455a; border-radius:8px;
    opacity:.35; animation: float 9s ease-in-out infinite;
  }
  .cube:nth-child(1){top:8%; left:10%; animation-delay:0s;}
  .cube:nth-child(2){top:70%; left:14%; animation-delay:1.2s; width:30px;height:30px;}
  .cube:nth-child(3){top:20%; left:85%; animation-delay:2.4s;}
  .cube:nth-child(4){top:78%; left:80%; animation-delay:.6s; width:60px;height:60px;}
  .cube:nth-child(5){top:45%; left:4%; animation-delay:1.8s; width:24px;height:24px;}
  .cube:nth-child(6){top:50%; left:92%; animation-delay:3s; width:36px;height:36px;}
  @keyframes float{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-22px) rotate(10deg);}
  }

  .card{
    position:relative; z-index:2;
    width:min(92vw, 400px);
    background:linear-gradient(180deg, var(--panel), var(--panel2));
    border:1px solid #33333f;
    border-radius:20px;
    padding:32px 26px 28px;
    box-shadow: 0 30px 60px rgba(0,0,0,.55);
    text-align:center;
    animation: cardIn .6s cubic-bezier(.2,.9,.3,1.3) both;
  }
  @keyframes cardIn{
    from{opacity:0; transform:translateY(30px) scale(.94);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  .logo-wrap{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px;}

  /* image logo, shown if logo.png exists */
  #logoImg{
    height:100px;
    display:none;
    animation: pulseLogo 2.4s ease-in-out infinite;
  }
  /* fallback drawn logo, shown if no image found */
  .logo-icon{
    width:42px;height:42px;
    background:linear-gradient(145deg, var(--main), var(--main-dark));
    border-radius:11px; position:relative;
    box-shadow: 0 6px 16px rgba(226,35,26,.45), inset 0 2px 3px rgba(255,255,255,.25);
    animation: pulseLogo 2.4s ease-in-out infinite;
  }
  .logo-icon::before{
    content:""; position:absolute; inset:9px;
    border:3px solid rgba(255,255,255,.85); border-radius:5px;
  }
  @keyframes pulseLogo{
    0%,100%{transform:scale(1) rotate(0deg);}
    50%{transform:scale(1.08) rotate(6deg);}
  }
  .logo-text{
    font-weight:900; font-size:26px; letter-spacing:1px; color:var(--white);
    text-shadow: 0 2px 0 var(--main-dark), 0 4px 10px rgba(226,35,26,.4);
  }

  .tagline{color:var(--grey); font-size:13px; margin:0 0 22px; letter-spacing:.4px;}

  .field-label{
    text-align:left; font-size:12px; color:var(--grey); margin:0 0 6px 2px;
    text-transform:uppercase; letter-spacing:1px; font-weight:700;
  }

  .amount-wrap{position:relative; margin-bottom:18px;}
  input[type="number"]{
    width:100%; padding:14px 16px; font-size:18px; font-weight:700; color:var(--white);
    background:#101016; border:2px solid #34343f; border-radius:12px; outline:none;
    transition: border-color .25s ease, box-shadow .25s ease, transform .15s ease;
    -moz-appearance:textfield;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  input[type="number"]:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(255,210,26,.15);
    transform: scale(1.01);
  }
  input::placeholder{color:#5c5c6b;}

  .coin{
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    width:22px;height:22px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff5c2, var(--accent) 60%, #b8921a);
    box-shadow:0 0 8px rgba(255,210,26,.5);
    animation: spinCoin 3s linear infinite;
  }
  .coin img{
    width:100%; height:100%; object-fit:cover; border-radius:50%;
    display:block;
  }
  @keyframes spinCoin{
    0%{transform:translateY(-50%) rotateY(0deg);}
    100%{transform:translateY(-50%) rotateY(360deg);}
  }

  .btn{
    width:100%; padding:15px; font-size:16px; font-weight:800; letter-spacing:.6px;
    text-transform:uppercase; color:#fff;
    background:linear-gradient(145deg, var(--main), var(--main-dark));
    border:none; border-radius:12px; cursor:pointer; position:relative; overflow:hidden;
    box-shadow: 0 10px 22px rgba(226,35,26,.4), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .15s ease, box-shadow .25s ease;
  }
  .btn:hover{ transform: translateY(-2px); box-shadow: 0 14px 30px rgba(226,35,26,.55), inset 0 1px 0 rgba(255,255,255,.3); }
  .btn:active{ transform: translateY(1px) scale(.98); }
  .btn::after{
    content:""; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.35), transparent);
    transform:skewX(-20deg); transition:left .6s ease;
  }
  .btn:hover::after{ left:140%; }

  .footer-note{ margin-top:16px; font-size:11px; color:#54545f; letter-spacing:.3px; }

  .overlay{
    position:fixed; inset:0; background:rgba(5,5,8,.75); backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition: opacity .35s ease; z-index:10; padding:20px;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }

  .result-card{
    width:min(90vw, 380px);
    background:linear-gradient(180deg, var(--panel), var(--panel2));
    border:1px solid #3a3a47; border-radius:20px; padding:30px 24px; text-align:center;
    box-shadow:0 30px 70px rgba(0,0,0,.6);
    transform: scale(.7) translateY(30px); opacity:0;
    transition: transform .45s cubic-bezier(.2,.9,.25,1.5), opacity .35s ease;
  }
  .overlay.show .result-card{ transform: scale(1) translateY(0); opacity:1; }

  .result-emoji{ font-size:44px; display:block; margin-bottom:10px; animation: bounceEmoji .9s ease infinite; }
  @keyframes bounceEmoji{
    0%,100%{transform:translateY(0) rotate(0deg);}
    25%{transform:translateY(-8px) rotate(-8deg);}
    75%{transform:translateY(-8px) rotate(8deg);}
  }

  .result-text{ font-size:20px; font-weight:800; color:var(--white); line-height:1.4; margin:0 0 20px; }

  .close-btn{
    padding:12px 26px; font-weight:700; font-size:14px; color:#fff;
    background:#2d2d38; border:2px solid #44445a; border-radius:10px; cursor:pointer;
    transition: background .2s ease, transform .15s ease;
  }
  .close-btn:hover{ background:#3a3a48; transform:translateY(-1px); }
</style>
</head>
<body>

<!-- ============================================================
     CUSTOMIZE EVERYTHING HERE 👇
     ============================================================ -->
<script>
  const CONFIG = {
    SITE_NAME: "",                 // change the brand name shown next to the logo
    TAGLINE: "Free Robux Generator 2026 Edition",
    CURRENCY_LABEL: "Robux",              // shows in placeholder + button text
    LOGO_FILE: "logo.png",                // put a logo.png next to this file (optional)
    ICON_FILE: "icon.png",                // put an icon.png next to this file for the tab icon (optional)
    BACKGROUND_FILE: "background.png",    // put a background.png next to this file (optional)
    COIN_FILE: "coin.png",                // put a coin.png next to this file to replace the spinning coin (optional)
    REVEAL_TEXT: "Bruh Zyriene actually fell for it HAHAHAH"
  };
</script>
<!-- ============================================================ -->

  <div class="cube"></div>
  <div class="cube"></div>
  <div class="cube"></div>
  <div class="cube"></div>
  <div class="cube"></div>
  <div class="cube"></div>

  <div class="card">
    <div class="logo-wrap">
      <img id="logoImg" alt="logo">
      <div class="logo-icon" id="fallbackIcon"></div>
      <div class="logo-text" id="siteName"></div>
    </div>
    <p class="tagline" id="tagline"></p>

    <div class="field-label" id="fieldLabel">Enter Amount</div>
    <div class="amount-wrap">
      <input id="amount" type="number" placeholder="e.g. 10000" min="1">
      <div class="coin" id="coinWrap"></div>
    </div>

    <button class="btn" id="getBtn">Get</button>
    <p class="footer-note">100% Safe • No Human Verification • Instant</p>
  </div>

  <div class="overlay" id="overlay">
    <div class="result-card">
      <span class="result-emoji">🫩</span>
      <p class="result-text" id="revealText"></p>
      <button class="close-btn" id="closeBtn">Close</button>
    </div>
  </div>

<script>
  // Apply config to the page
  document.getElementById('siteName').textContent = CONFIG.SITE_NAME;
  document.getElementById('tagline').textContent = CONFIG.TAGLINE;
  document.getElementById('fieldLabel').textContent = "Enter Amount";
  document.getElementById('amount').placeholder = "e.g. 10000";
  document.getElementById('getBtn').textContent = "Get " + CONFIG.CURRENCY_LABEL;
  document.getElementById('revealText').textContent = CONFIG.REVEAL_TEXT;
  document.getElementById('favicon').href = CONFIG.ICON_FILE;

  // Try to load logo.png; if it fails (missing), keep the drawn fallback icon instead
  const logoImg = document.getElementById('logoImg');
  const fallbackIcon = document.getElementById('fallbackIcon');
  logoImg.src = CONFIG.LOGO_FILE;
  logoImg.onload = () => { logoImg.style.display = 'inline-block'; fallbackIcon.style.display = 'none'; };
  logoImg.onerror = () => { logoImg.style.display = 'none'; fallbackIcon.style.display = 'block'; };

  // Try to load background.png; if missing, body keeps the plain dark theme
  const bgTest = new Image();
  bgTest.onload = () => { document.body.style.setProperty('--bg-image', `url("${CONFIG.BACKGROUND_FILE}")`); };
  bgTest.src = CONFIG.BACKGROUND_FILE;

  // Try to load coin.png; if missing, keep the drawn gold coin circle
  const coinWrap = document.getElementById('coinWrap');
  const coinTest = new Image();
  coinTest.onload = () => {
    coinWrap.style.background = 'none';
    coinWrap.style.boxShadow = 'none';
    const img = document.createElement('img');
    img.src = CONFIG.COIN_FILE;
    coinWrap.appendChild(img);
  };
  coinTest.src = CONFIG.COIN_FILE;

  // Button logic
  const getBtn = document.getElementById('getBtn');
  const overlay = document.getElementById('overlay');
  const closeBtn = document.getElementById('closeBtn');

  getBtn.addEventListener('click', () => { overlay.classList.add('show'); });
  closeBtn.addEventListener('click', () => { overlay.classList.remove('show'); });
  overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('show'); });
</script>
</body>
</html>
